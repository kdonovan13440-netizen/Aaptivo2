services:
  - type: web
    name: aptivo-agent
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AGENT_VERTICAL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_HOURS
        sync: false
